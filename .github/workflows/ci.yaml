name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: script/cibuild
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: build
        run: script/bootstrap
      - name: test
        run: script/cibuild
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Upload browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-diagnostics
          path: ${{ runner.temp }}/autodial-ui-test-*
          if-no-files-found: ignore
          retention-days: 7
