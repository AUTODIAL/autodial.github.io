      - id: benhour-amirian
        name: Benhour Amirian
        role: AutoDIAL Alumnus - Now at Apple
        card_title: Apple
        photo: Ben
        bio: >-
          <p>Benhour received a Ph.D. in Mechanical Engineering from the University of Alberta, where his research focused on physics-based modeling of failure in novel brittle materials. He has experience applying advanced computational methods to multiphysics modeling of additive manufacturing processes for high-entropy alloys, as well as integrating machine learning with conventional solvers for phase-field and crystal plasticity models. To speed up and automate the process, he is now integrating a machine learning framework into a physics-based model that captures the essential physical properties of electrochemical impedance spectroscopy.</p>

