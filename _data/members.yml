  - id: principal-investigator
    title: Principle Investigator
    featured: true
    members:
      - id: jason-hattrick-simpers
        name: Jason Hattrick-Simpers
        role: Principal Investigator
        photo: Jae
        bio: >-
          <p>Jason Hattrick-Simpers leads the Autonomous Discovery of Alloys (AutoDIAL) research group at the University of Toronto. His research focuses on autonomous materials discovery, high-throughput experimentation, and machine learning applications in materials science.</p>
        links:
          - platform: linkedin
            url: https://www.linkedin.com/in/jason-hattrick-simpers-8462ab20/
          - platform: scholar
            url: https://scholar.google.com/citations?user=P3ce5ZwAAAAJ&hl=en&oi=ao

  - id: post-docs
    title: Post Docs
    members:
      - id: yutong-liu
        name: Yutong Liu
        role: Post Doc
        photo: Yutong_Liu
        bio: >-
          <p>Yutong Liu joined the group in December 2023 as a postdoctoral fellow. She is currently working on autonomous materials discovery for oxygen evolution reaction (OER) catalysts using high-throughput experimentation. Yutong completed her Ph.D. in Chemistry at University of Waterloo (2018–2023), where her research focused on defect investigation in hematite photoanodes for solar water splitting. She holds a Bachelor of Science in Materials and Nanosciences from the University of Waterloo and a Bachelor of Engineering from Beijing Jiaotong University, both earned through the BJTU-UW 2+2 Joint Program (2014–2018).</p><p>Outside of work, Yutong enjoys movies, yelling at soccer games, and relaxing with her two cats.</p>
        links:
          - platform: linkedin
            url: https://www.linkedin.com/in/yutong-liu-63082022a/

      - id: changjun-cheng
        name: Changjun Cheng
        role: Post Doc
        photo: Changjun_Cheng
        bio: >-
          <p>Changjun Cheng is currently a Postdoctoral Fellow in AUTOnomous DIscovery of ALloys (AUTODIAL) within the Department of Materials Science and Engineering at the University of Toronto. He received his doctorate, master’s, and bachelor’s degrees from University of Toronto, Zhejiang University, and Zhejiang University, respectively. His research focuses on the accelerated discovery of thermal stability and phase transition of nanocrystalline multiple-component materials, specifically in the investigation of high-throughput methods and high-entropy alloys. He also conducts collaborations with Toronto Nanofabrication Centre and Canadian Light Source for the high-throughput fabrication and characterization of nanostructured thin films.</p><p>Cheng’s scholarly contributions extend to over 10 peer-reviewed journal papers, including a notable research paper (Cheng et al. Advanced Materials 2024) and a recently published review paper (Cheng et al. Progress in Materials Science 2025) about high-throughput research on nanostructured HEAs.</p>
        links:
          - platform: linkedin
            url: https://www.linkedin.com/in/changjun-cheng-5b282a192/
          - platform: researchgate
            url: https://www.researchgate.net/profile/Changjun-Cheng
          - platform: scholar
            url: https://scholar.google.com/citations?user=hqUO03kAAAAJ&hl=en&oi=ao

      - id: hao-wan
        name: Hao Wan
        role: Post Doc
        photo: Hao_Wan
        bio: >-
          <p>Hao Wan joined the group at the University of Toronto in June 2025. My research focuses on the synthesizability of novel HEOs. Before joining the University of Toronto, I was an Alexander von Humboldt Fellow at the Fritz-Haber-Institut of the Max Planck Society, where I developed DFT-based machine learning interatomic potentials to study catalyst degradation. I hold a PhD in Chemistry from the University of Copenhagen, where my work centered on understanding catalytic activity trends of catalysts on various electrochemical reactions via a descriptor-based approach.</p>
        links:
          - platform: linkedin
            url: https://www.linkedin.com/in/hao-wan-9b5833313
          - platform: scholar
            url: https://scholar.google.com/citations?user=loE8V6oAAAAJ&hl=en&oi=ao

