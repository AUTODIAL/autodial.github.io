      - id: zhaoyang-zhao
        name: Zhaoyang Zhao
        role: AutoDIAL Alumnus
        photo: Zhaoyang_Zhao
        bio: >-
          <p>Zhaoyang Zhao served as a Postdoctoral Fellow in the Department of Materials Science & Engineering at the University of Toronto beginning June 2024. His research focused on sensitivity analysis of X-ray diffraction (XRD) data and on using artificial intelligence (AI) to help experimentalist discover high-performance oxygen evolution reaction (OER) catalysts. Zhaoyang earned both his B.Sc. and Ph.D. in Materials Science and Engineering from the University of Science and Technology Beijing (2013–2024). During his doctoral studies, he developed automated pipelines that combine AI and optimization algorithms to analyze materials-characterization data—electrochemical impedance spectroscopy (EIS) and XRD—and advocates for the seamless integration of domain knowledge with AI to creatively address challenges in materials science.</p>
        links:
          - platform: github
            url: https://github.com/DreamBoatOve
