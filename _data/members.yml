      - id: md-shafiqul-islam
        name: Md Shafiqul Islam
        role: Ph.D. Student
        photo: Shafiq
        bio: >-
          <p>Md. Shafiqul Islam is a Ph.D. student in Materials Science and Engineering at the University of Toronto. His research focuses on Bayesian optimal experimental design, active learning, and uncertainty quantification to efficiently guide high-throughput materials experiments.</p><p>He holds an M.S. in Materials Science and Engineering from Texas A&M University, where his research focused on additive manufacturing of refractory high-entropy alloys, applying CALPHAD modeling and multi-objective Bayesian optimization for materials and process co-design. He earned his B.Sc. in Materials and Metallurgical Engineering from Bangladesh University of Engineering and Technology (BUET).</p>
        links:
