  - id: automation-specialists
    title: Automation Specialists
    members:
      - id: quentin-currier-moritsugu
        name: Quentin Currier-Moritsugu
        role: Automation Specialist
        photo: Quentin
        bio: >-
          <p>Quentin joined the group in December 2025 as an Automated Experiment Specialist. His work focuses on developing reliable, high-throughput experimental workflows for materials discovery, including laboratory automation, robotic liquid handling, and the integration of synthesis and characterization processes. His initial work with the group has centered on high-throughput synthesis workflows for catalyst discovery.Quentin holds a Master of Applied Science in Electrical Engineering and a Bachelor of Engineering in Biomedical Engineering from Toronto Metropolitan University. His graduate research focused on the design and proof-of-concept fabrication of a novel passive wireless inductive pressure sensor, establishing an architecture suitable for future MEMS-scale miniaturization. Outside of work, Quentin enjoys canoe tripping, board games, and grappling sports.</p>

