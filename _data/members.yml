      - id: qiuyu-sara-shi
        name: Qiuyu (Sara) Shi
        role: Ph.D. Student
        photo: Qiuyu_(Sara)_Shi
        bio: >-
          <p>Qiuyu (Sara) Shi is a 4th year Ph.D. candidate focusing on detecting and recovering noisy features in self-driving laboratories and studying degradation behaviors in electrochemical systems through Electrochemical Impedance Spectroscopy (EIS) analysis. Sara earned her Bachelor of Science in Materials and Nanoscience in 2019 and her Master of Applied Science (MASc) in Chemical Engineering (Nanotechnology) in 2021, both from the University of Waterloo.</p><p>An experienced experimentalist in Zn-ion batteries and solar cells, Sara is currently leveraging machine learning techniques for applications in materials science. She has led and contributed to multiple projects in collaboration with industrial and governmental partners, including Sekisui Co., Ltd. (Japan) and the National Research Council (NRC) Mississauga.</p><p>Sara actively participates in conferences and workshops, engaging with researchers across diverse disciplines. Her recent engagements include IMSI Workshop 2024, Accelerate Conference 2024, MRS Spring 2025, and UT2-MAC Workshop 2025. In her spare time, Sara enjoys playing badminton and practicing IPSC shooting.</p>
        links:
          - platform: cv
            url: https://drive.google.com/file/d/1kfdDXHULlfR2aVhbiOSZf4O2gldkyBk1/view?usp=sharing
          - platform: linkedin
            url: https://www.linkedin.com/in/qiuyu-sara-shi/
