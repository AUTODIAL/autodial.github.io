      - id: ashley-dale
        name: Ashley Dale
        role: AutoDIAL Alumnus - Now a Post Doc at MIT
        card_title: MIT
        photo: Ashley_Dale
        bio: >-
          <p>Ashley Dale joined AutoDIAL as a Schmidt AI in Science Postdoctoral Fellow in October 2024. Her research focuses on Trustworthy AI Tools for Science, explainable uncertainty quantification for foundation models, and developing trustworthy autonomous laboratory platforms. In 2024, Ashley earned a Ph.D. in physics from Indiana University and a Ph.D. from Purdue University in electrical engineering with a topic in AI for computer vision.</p><p>Her personal website is found <a href="https://daleas0120.github.io/" target="_blank" rel="noopener noreferrer">here</a>.</p>
        links:
