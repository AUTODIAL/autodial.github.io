      - id: yonatan-kurniawan
        name: Yonatan Kurniawan
        role: Post Doc
        photo: Yonatan
        bio: >-
          <p>Yonatan Kurniawan joined the group in October 2025. His research focuses on applying active learning, uncertainty quantification, and sloppy model analysis to electrochemical impedance spectroscopy, aiming to improve model performance and interpretability for battery material discovery. He earned his Ph.D. in Physics from Brigham Young University, where he used information geometry to investigate uncertainty in interatomic models. His broader interests include integrating uncertainty quantification and active learning through sloppy model analysis and information geometry to enhance model predictions, uncertainties, and interpretability.</p><p>Outside of work, Yonatan enjoys playing video games, watching anime, playing guitar, and solving Sudoku puzzles.</p>
        links:
          - platform: website
            url: https://yonatank93.github.io/
          - platform: linkedin
            url: https://www.linkedin.com/in/kurniawanyo/
          - platform: scholar
            url: https://scholar.google.com/citations?user=eYu4evsAAAAJ&hl=en&oi=ao

      - id: jingyan-zhang
        name: Jingyan Zhang
        role: Post Doc
        photo: Jingyan_Zhang
        bio: >-
          <p>Jingyan Zhang joined the group as a Postdoctoral Fellow in June 2026. Her current research focuses on AI-driven materials acceleration and electrochemical metal recovery through self-driving experimental platforms.</p>

      - id: ang-leo-li
        name: Ang (Leo) Li
        role: Post Doc
        photo: Ang_Li
        bio: >-
          <p>Ang (Leo) Li joined the group in June 2026 as a Vector Distinguished Postdoctoral Fellow, hosted by Professors Jason Hattrick-Simpers and Anatole von Lilienfeld. He focuses on developing self-driving laboratories. He received his BASc in Computer Engineering in 2021 and his PhD in Mechanical Engineering in 2026 from the University of Toronto.</p>

