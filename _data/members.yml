      - id: runze-zhang
        name: Runze Zhang
        role: AutoDIAL Alumnus
        photo: Runze_Zhang
        bio: >-
          <p>Runze Zhang joined the group in January 2022 and has been on a mission to teach machines how to do materials analysis. His research focuses on building open-source tools that facilitate materials analysis by reducing human bias and minimizing the need for a PhD-level brain to interpret experimental data. By blending statistical reasoning with machine learning, he hopes to make materials data not only more trustworthy and reproducible, but also less mysterious.</p><p>Before joining the group, Runze earned his BASc degree in Polymer Engineering and Science from the Harbin Institute of Technology. As an undergraduate, he worked on projects involving the synthesis, scale-up, modification, and application of polyhedral oligomeric silsesquioxanes.</p><p>Outside of research, Runze enjoys playing piano and chilling with his cats.</p>
        links:
          - platform: github
            url: https://github.com/RunzeZhang123
          - platform: linkedin
