            url: https://scholar.google.ca/citations?user=WmOtdtUAAAAJ&hl=en&oi=ao

      - id: rafael-espinosa-castaneda
        name: Rafael Espinosa Castañeda
        role: Ph.D. Student
        photo: RafaelEspinosaCastanedaPhoto
        bio: >-
          <p>Rafael Espinosa Castañeda is a Ph.D. candidate in Materials Science and Engineering at the University of Toronto, working under the supervision of Professor Jason Hattrick-Simpers. Before beginning his doctoral studies, he was the director of the Data Science and Mathematics Engineering program at Tecnológico de Monterrey, Campus Querétaro. Also, he was Lecturer of Physics, Mathematics and Data Science. He received a master’s in data science from the University of Texas at Austin, a Master’s in Theoretical Physics from the University of Cambridge and a bachelor’s in physics from Universidad de las Américas Puebla. Rafael’s research mainly focuses on Multi-Objective Active Learning to accelerate the discovery of next-generation battery materials. He also actively collaborates in Large Language Models and Open-Source AI Software for Materials Science.</p>
        links:
          - platform: linkedin
            url: https://www.linkedin.com/in/rafael-espinosa-276758148
          - platform: scholar
            url: https://scholar.google.com/citations?user=bUpSQoAAAAAJ&hl=en&oi=ao

